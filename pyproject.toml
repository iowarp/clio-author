[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clio-parser"
version = "0.0.1"
description = "Standalone multi-agent harness for processing, reviewing, and writing scientific papers."
requires-python = ">=3.12"
dependencies = ["pydantic>=2"]

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["clio_parser"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
