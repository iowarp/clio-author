[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clio-author"
version = "0.4.0"
description = "Standalone multi-agent harness for processing, reviewing, and writing scientific papers."
requires-python = ">=3.12"
license = "BSD-3-Clause"
dependencies = ["pydantic>=2"]

[project.scripts]
clio-author = "clio_author.cli:main"
clio-author-a2a = "clio_author.integration.a2a_server:main"
clio-author-mcp = "clio_author.integration.mcp_bridge:main"

[project.optional-dependencies]
# Heavy PDF-extraction stack. Kept OUT of core deps: Docling pulls ~500MB of
# ML models on first run. Install with `uv sync --extra pdf` only when needed.
pdf = ["docling>=2.0.0", "pymupdf>=1.26.6", "pillow>=10", "httpx", "torch", "torchvision"]
# Heavy retrieval backend (real embeddings + vector store). Kept OUT of core
# deps: sentence-transformers downloads model weights on first use. The default
# `HashingEmbedder` + in-memory `RagRetriever` need none of this. Install with
# `uv sync --extra rag` only when using the LanceDB / SentenceTransformer path.
rag = ["lancedb", "sentence-transformers", "numpy", "torch"]
# Citation grounding (Semantic Scholar retrieval + fuzzy title matching). Kept
# OUT of core deps: the verification LOGIC is pure stdlib (difflib fallback) and
# the S2 HTTP client is lazy/gated, so the default suite needs none of this.
# Install with `uv sync --extra scholar` for the real S2 client + thefuzz.
scholar = ["thefuzz", "httpx"]
# Figure rendering (matplotlib). Kept OUT of core deps: the figure agent's
# default path only generates plot CODE (LLM text) and never imports matplotlib;
# actual rendering is gated behind `render_plot_code` (subprocess + `live`
# marker). Install with `uv sync --extra viz` to run the gated render tests.
viz = ["matplotlib"]
mcp = ["fastmcp"]

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

# Pin torch/torchvision to the CPU wheels so the `pdf`/`rag` extras resolve to
# matching builds and `uv sync --all-extras` "just works" (avoids the
# `torchvision::nms` mismatch from mixing a CPU torch with a PyPI torchvision).
# GPU users can override: drop this index or point it at a CUDA build.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[tool.hatch.build.targets.wheel]
packages = ["clio_author"]

[tool.ruff]
line-length = 100

[tool.mypy]
# Optional `pdf` extra is not installed in the default/dev env. These third-party
# packages ship no stubs and are lazy-imported inside functions, so missing
# imports here are expected and must not fail the type check.
[[tool.mypy.overrides]]
module = ["docling.*", "fitz", "httpx"]
ignore_missing_imports = true

# Optional `rag` extra is likewise lazy-imported and absent from the default env.
[[tool.mypy.overrides]]
module = ["lancedb.*", "sentence_transformers.*", "numpy"]
ignore_missing_imports = true

# Optional `scholar` extra is lazy-imported and absent from the default env.
[[tool.mypy.overrides]]
module = ["thefuzz.*"]
ignore_missing_imports = true

# Optional `viz` extra (matplotlib) is lazy-imported (only inside
# `render_plot_code`) and absent from the default env.
[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true

# Optional `mcp` extra (fastmcp) is lazy-imported inside the MCP bridge and absent
# from the default env.
[[tool.mypy.overrides]]
module = ["fastmcp", "fastmcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep the default suite hermetic: no network and no Docling/ML model loads.
# `live` = needs network; `baseline` = compares against reference impls / real PDFs.
markers = [
    "live: tests that require network access (deselected by default)",
    "baseline: tests that compare against reference impls or real PDFs (deselected by default)",
]
addopts = "-m 'not live and not baseline'"
