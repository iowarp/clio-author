[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clio-parser"
version = "0.0.1"
description = "Standalone multi-agent harness for processing, reviewing, and writing scientific papers."
requires-python = ">=3.12"
license = "BSD-3-Clause"
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
# Heavy PDF-extraction stack. Kept OUT of core deps: Docling pulls ~500MB of
# ML models on first run. Install with `uv sync --extra pdf` only when needed.
pdf = ["docling>=2.0.0", "pymupdf>=1.26.6", "pillow>=10", "httpx"]
# Heavy retrieval backend (real embeddings + vector store). Kept OUT of core
# deps: sentence-transformers downloads model weights on first use. The default
# `HashingEmbedder` + in-memory `RagRetriever` need none of this. Install with
# `uv sync --extra rag` only when using the LanceDB / SentenceTransformer path.
rag = ["lancedb", "sentence-transformers", "numpy"]

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["clio_parser"]

[tool.ruff]
line-length = 100

[tool.mypy]
# Optional `pdf` extra is not installed in the default/dev env. These third-party
# packages ship no stubs and are lazy-imported inside functions, so missing
# imports here are expected and must not fail the type check.
[[tool.mypy.overrides]]
module = ["docling.*", "fitz", "httpx"]
ignore_missing_imports = true

# Optional `rag` extra is likewise lazy-imported and absent from the default env.
[[tool.mypy.overrides]]
module = ["lancedb.*", "sentence_transformers.*", "numpy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep the default suite hermetic: no network and no Docling/ML model loads.
# `live` = needs network; `baseline` = compares against reference impls / real PDFs.
markers = [
    "live: tests that require network access (deselected by default)",
    "baseline: tests that compare against reference impls or real PDFs (deselected by default)",
]
addopts = "-m 'not live and not baseline'"
